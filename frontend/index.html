<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ming Ramen Bar｜排班系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260925">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* 例外で画面が真っ白のまま終わらないよう、エラーを画面上に出す。 */
(function () {
  function show(msg) {
    var el = document.getElementById('fatalError');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fatalError';
      el.className = 'fatal-error';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = '⚠ 錯誤：' + msg;
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) {
    var f = String(e.filename || '').split('/').pop();
    show((e.message || 'unknown') + (f ? '  @' + f + ':' + (e.lineno || '?') : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Promise: ' + ((r && (r.message || r)) || 'unknown'));
  });
})();
</script>
</head>
<body>

<!--
  員工の排班は LINE（リッチメニュー → LIFF）に移したので、このページは
  「管理員の入口」と「員工を LINE へ案内する道しるべ」だけになった。
  員工用のフォームは liff-shift.html にある。
-->
<div class="phone">
  <div class="noren">
    <span class="demo-badge" id="demoBadge" style="display:none;">DEMO</span>
    <p class="eyebrow">MING RAMEN BAR</p>
    <h1>排班系統</h1>
    <p>員工請從 LINE 進入</p>
  </div>

  <div id="syncBanner" class="sync-banner"></div>

  <!-- ============ 員工向け：LINE へ案内（既定でこれが出る） ============ -->
  <div class="gate" id="staffGate" style="display:none;">
    <div class="gate-card">
      <p class="gate-eyebrow">FOR STAFF</p>
      <h2>請從 LINE 填班表</h2>
      <p class="gate-text">
        填希望排班不用登入了。打開 LINE 的<b>店家官方帳號</b>，
        點下面選單的 <b>「📅 提交班表」</b>就會直接進入班表。
      </p>
      <a class="btn-line" id="openLiffBtn" href="#" style="display:none;">用 LINE 開啟班表</a>
      <p class="gate-text" id="liffMissing" style="display:none;">
        （系統還沒設定好 LINE 入口，請聯絡店長。）
      </p>
      <button class="btn-link" id="toAdminBtn">我是管理員，要看全員班表</button>
    </div>
  </div>

  <!-- ============ 管理員向け：Google 登入 ============ -->
  <div class="gate" id="authGate" style="display:none;">
    <div class="gate-card">
      <p class="gate-eyebrow">ADMIN LOGIN</p>
      <h2>請以管理員帳號登入</h2>
      <p class="gate-text">
        只有登記在 <code>ADMIN_EMAILS</code> 裡的 Google 帳號可以進入管理頁。
      </p>
      <div class="gsi-slot" id="gsiButton"></div>
      <div class="gate-busy" id="authBusy" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="authBusyText">登入中…</span>
      </div>
      <p class="gate-error" id="authError"></p>
      <button class="btn-link" id="backToStaffBtn">← 我是員工</button>
    </div>
  </div>

  <!-- ============ 管理員ではなかった ============ -->
  <div class="gate" id="denyGate" style="display:none;">
    <div class="gate-card">
      <p class="gate-eyebrow">FORBIDDEN</p>
      <h2>沒有管理權限</h2>
      <p class="gate-text">
        <b id="denyEmail"></b> 不在管理員名單內。<br>
        如果你是員工，請改用 LINE 的選單填班表。
      </p>
      <a class="btn-line" id="denyLiffBtn" href="#" style="display:none;">用 LINE 開啟班表</a>
      <button class="btn-link" id="denySignOut">改用其他 Google 帳號登入</button>
    </div>
  </div>
</div>

<script src="js/config.js?v=20260925"></script>
<script src="js/auth.js?v=20260925"></script>
<script>
/**
 * このページの役割は振り分けだけ：
 *   員工   → LINE（LIFF）へ案内する
 *   管理員 → Google ログインして admin.html へ送る
 * 班表そのものの処理は liff-shift.html（+ app.js）が持っている。
 */
(function () {
  const $ = function (id) { return document.getElementById(id); };
  const staffGate = $('staffGate');
  const authGate = $('authGate');
  const denyGate = $('denyGate');

  function showOnly(el) {
    [staffGate, authGate, denyGate].forEach(function (node) {
      node.style.display = node === el ? 'block' : 'none';
    });
  }

  const liffUrl = (typeof isLiffConfigured !== 'undefined' && isLiffConfigured)
    ? 'https://liff.line.me/' + CONFIG.LIFF_ID
    : '';

  ['openLiffBtn', 'denyLiffBtn'].forEach(function (id) {
    const el = $(id);
    if (liffUrl) { el.href = liffUrl; el.style.display = 'block'; }
  });
  if (!liffUrl) $('liffMissing').style.display = 'block';

  if (typeof isDemoMode !== 'undefined' && isDemoMode) {
    $('demoBadge').style.display = 'inline-block';
  }

  $('toAdminBtn').onclick = function () { showOnly(authGate); startSignIn(); };
  $('backToStaffBtn').onclick = function () { showOnly(staffGate); };
  $('denySignOut').onclick = function () { Auth.signOut(); location.reload(); };

  let signingIn = false;

  function setBusy(busy, text) {
    const slot = $('gsiButton');
    const busyEl = $('authBusy');
    if (slot) slot.style.display = busy ? 'none' : 'flex';
    if (busyEl) {
      busyEl.hidden = !busy;
      if (busy && text) $('authBusyText').textContent = text;
    }
  }

  async function startSignIn() {
    if (signingIn) return;
    signingIn = true;
    $('authError').textContent = '';
    setBusy(false);

    try {
      await Auth.signIn($('gsiButton'));
    } catch (err) {
      signingIn = false;
      setBusy(false);
      $('authError').textContent = err.message;
      return;
    }

    setBusy(true, '登入成功，確認身分中…');
    try {
      const who = await Auth.whoami();
      setBusy(false);
      if (!who.ok) {
        $('authError').textContent = Auth.describeError(who.error);
        return;
      }
      // 管理員なら管理頁へ。員工でもある店長も、班表は LINE から出す。
      if (who.isAdmin || who.role === 'admin') {
        location.href = 'admin.html';
        return;
      }
      $('denyEmail').textContent = who.email || '';
      showOnly(denyGate);
    } finally {
      signingIn = false;
    }
  }

  Auth.onAuthLost = function () { showOnly(staffGate); };
  showOnly(staffGate);
})();
</script>

</body>
</html>
